name: Train Model and Log to MLflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load environment variables from .env
        run: |
          echo "Loading .env vars into GitHub Actions"
          cat .env >> $GITHUB_ENV

      - name: Install DVC
        run: pip install dvc[http]

      - name: Pull data with DVC
        run: dvc pull -r dagshub_remote --verbose

      - name: Train model and log to MLflow
        run: |
          echo "Exporting DagsHub credentials for MLflow..."
          export MLFLOW_TRACKING_USERNAME=$(grep DAGSHUB_USERNAME .env | cut -d '=' -f2)
          export MLFLOW_TRACKING_PASSWORD=$(grep DAGSHUB_TOKEN .env | cut -d '=' -f2)
          export MLFLOW_TRACKING_URI=https://dagshub.com/KevinL-tech/jan25_bds_trafic_cycliste.mlflow
          python src/models/train_comptage_velo_MLflow.py

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Build and run API
        run: docker-compose up -d

      - name: Wait for API to be ready
        run: |
          echo "Attente de l'API..."
          for i in {1..10}; do
            if curl -s http://localhost:8000/ | grep -q "Welcome"; then
              echo "API disponible"
              break
            fi
            echo "Nouvel essai dans 5s..."
            sleep 5
          done

      - name: Run API tests
        run: |
          pip install pytest requests
          pytest tests/api_test.py

      - name: Stop Docker services
        run: docker-compose down